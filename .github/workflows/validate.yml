name: Validate Virtual-Real Transition Axis

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check required files and Python syntax
        run: |
          python --version
          test -f specs/vrta-v0.2.md
          test -f specs/vrta-v0.3.md
          test -f specs/vrta-v0.4.md
          test -f specs/vrta-v0.5.md
          python -m py_compile \
            axis.py evidence.py five_elements.py feedback.py role_rotation.py checkpoint.py \
            tests/test_axis.py tests/test_evidence.py tests/test_five_elements.py \
            tests/test_feedback.py tests/test_role_rotation.py \
            tests/test_checkpoint.py tests/test_restart_recovery.py

      - name: Validate v0.1 and v0.3 simulations
        run: |
          python axis.py > "$RUNNER_TEMP/vrta-legacy.txt"
          cat "$RUNNER_TEMP/vrta-legacy.txt"
          diff -u - "$RUNNER_TEMP/vrta-legacy.txt" <<'EXPECTED'
          virtual event 1: accepted
          virtual event 2: accepted
          virtual event 3: accepted
          virtual event 4: backpressure
          mode: degraded
          real verified analysis: True
          neutral: zero_neutral
          recovery check 1: False
          recovery check 2 + approval: True
          mode: normal
          audit chain valid: True
          records: 11
          EXPECTED

          python feedback.py > "$RUNNER_TEMP/vrta-feedback.txt"
          cat "$RUNNER_TEMP/vrta-feedback.txt"
          grep -Fq 'reason=virtual_overload' "$RUNNER_TEMP/vrta-feedback.txt"
          grep -Fq 'reason=hysteresis_hold' "$RUNNER_TEMP/vrta-feedback.txt"
          grep -Fq 'reason=recovery_pending' "$RUNNER_TEMP/vrta-feedback.txt"
          grep -Fq 'reason=recovery_eligible' "$RUNNER_TEMP/vrta-feedback.txt"
          grep -Fxq 'final simulated mode: normal' "$RUNNER_TEMP/vrta-feedback.txt"
          grep -Fxq 'retained windows: 3' "$RUNNER_TEMP/vrta-feedback.txt"

      - name: Run 143 regression and restart recovery tests
        run: |
          python - <<'PY'
          from collections import Counter
          import unittest

          expected = Counter({
              "test_axis": 15,
              "test_evidence": 25,
              "test_five_elements": 30,
              "test_feedback": 35,
              "test_role_rotation": 13,
              "test_checkpoint": 14,
              "test_restart_recovery": 11,
          })

          def cases(suite):
              for entry in suite:
                  if isinstance(entry, unittest.TestSuite):
                      yield from cases(entry)
                  else:
                      yield entry

          loader = unittest.TestLoader()
          # Treat tests/ as the discovery root. No tests/__init__.py required.
          suite = loader.discover(start_dir="tests", pattern="test_*.py")
          if loader.errors:
              raise SystemExit("\n".join(loader.errors))

          counts = Counter(case.__class__.__module__ for case in cases(suite))
          for name in sorted(counts.keys() | expected.keys()):
              print(f"{name}: {counts[name]}/{expected[name]}", flush=True)
          if counts != expected:
              raise SystemExit("Unexpected per-module test counts")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          if result.testsRun != sum(expected.values()) or result.skipped or result.expectedFailures:
              raise SystemExit("Not all required tests ran and passed")
          PY

      - name: Run v0.3 axis integration smoke test
        run: |
          python - <<'PY'
          from axis import Mode, TransitionAxisV3
          from feedback import LoadObservation

          axis = TransitionAxisV3(
              trusted_sources=frozenset({"sensor-alpha"}),
              element_bindings={},
              administrator=object(),
          )
          samples = [
              (0.90, 0.20, Mode.DEGRADED),
              (0.60, 0.50, Mode.DEGRADED),
              (0.30, 0.35, Mode.DEGRADED),
              (0.28, 0.31, Mode.DEGRADED),
              (0.25, 0.29, Mode.NORMAL),
          ]
          for window, (virtual, real, expected) in enumerate(samples, 1):
              axis.observe_load(LoadObservation(window, virtual, real))
              if axis.mode != expected:
                  raise SystemExit(f"Window {window}: expected {expected}, got {axis.mode}")

          axis.neutralize("integration test")
          axis.observe_load(LoadObservation(6, 0.0, 0.0))
          if axis.mode != Mode.ZERO_NEUTRAL:
              raise SystemExit("Feedback exited zero-neutral mode")
          if axis.recover(safety_verified=True, human_approved=False):
              raise SystemExit("Recovery succeeded without approval")
          if axis.mode != Mode.ZERO_NEUTRAL or not axis.audit.verify():
              raise SystemExit("Final mode or audit chain check failed")

          print("VRTA v0.3 axis integration: PASS")
          PY

      - name: Write validation summary
        run: |
          {
            echo '## VRTA v0.5 validation'
            echo ''
            echo '- Python ${{ matrix.python-version }}'
            echo '- Syntax and deterministic simulations passed'
            echo '- 118 v0.4 baseline tests passed'
            echo '- 14 checkpoint tests and 11 restart recovery tests passed'
            echo '- Total: 143 tests passed'
            echo '- Separate v0.3 axis integration smoke test passed'
          } >> "$GITHUB_STEP_SUMMARY"
